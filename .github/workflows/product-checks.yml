name: Product checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1-5'

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  GOTELEMETRY: 'off'

jobs:
  rails:
    name: Rails application foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: backend
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rails test

  gateway:
    name: Gateway and merchant regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: testbeds/voice-merchant/package-lock.json
      - run: node scripts/check-source-secrets.mjs
      - run: node --test scripts/tests/*.test.mjs
      - run: python -m unittest discover -s testbeds/pipeline-lab/tests
      - run: rustup show
      - run: cargo test -p cosigna-agent --locked
      - run: cargo run -p cosigna-agent --locked -- pipeline-demo
      - run: node scripts/check-gateway-service.mjs
      - name: Northwind runtime error and credential boundaries (no inference)
        run: python -I experiments/northwind2/test_codex_runtime.py
      - name: Northwind Stripe wiring (scripted agent, loopback provider)
        run: python -I experiments/northwind2/offline_check.py --binary "$PWD/target/debug/cosigna-agent"
      - name: Independent Python evidence verifier (rules replay, consistent-forgery tests)
        run: python3 -m venv .verifier && .verifier/bin/pip install --quiet blake3==1.0.11 && COSIGNA_AGENT_BIN="$PWD/target/debug/cosigna-agent" .verifier/bin/python -I tools/evidence-verifier/test_verify_evidence.py
      - name: Live attack, stress and crash lab (fixture rail, loopback only)
        run: .verifier/bin/python -I testbeds/gateway-attack-lab/attack_lab.py --binary "$PWD/target/debug/cosigna-agent" --out attack-lab.json
      - name: Validate private Linux service templates
        run: |
          sudo install -d /opt/cosigna/bin
          sudo install -m 0755 target/debug/cosigna-agent /opt/cosigna/bin/cosigna-agent
          systemd-analyze verify deploy/systemd/cosigna-api.service deploy/systemd/cosigna-worker.service
      - run: npm ci
        working-directory: testbeds/voice-merchant
      - run: npm test
        working-directory: testbeds/voice-merchant

  console:
    name: Console and site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:dev
      - name: Live gateway decisions through the console
        run: cargo build -p cosigna-agent --locked && npm run test:gateway
      - name: Server deployment: console behind the TLS proxy, gateway-only
        run: npm run test:public
      - run: npm run check && npm test
        working-directory: site

  mobile:
    name: Mobile contracts and Expo bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npm run test:ios -- --watch=false
      - run: npm run test:native-config
      - run: npm run bundle:android

  cli:
    name: Go CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test ./...
