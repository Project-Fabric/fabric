name: Product checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1-5'

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  GOTELEMETRY: 'off'

jobs:
  gateway:
    name: Gateway and merchant regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: testbeds/voice-merchant/package-lock.json
      - run: node scripts/check-source-secrets.mjs
      - run: node --test scripts/tests/*.test.mjs
      - run: rustup show
      - run: cargo test -p cosigna-agent --locked
      - run: cargo run -p cosigna-agent --locked -- pipeline-demo
      - run: npm ci
        working-directory: testbeds/voice-merchant
      - run: npm test
        working-directory: testbeds/voice-merchant

  console:
    name: Console and site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:dev
      - run: npm run check && npm test
        working-directory: site

  mobile:
    name: Mobile contracts and Expo bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npm run test:ios -- --watch=false
      - run: npm run test:native-config
      - run: npm run bundle:android

  cli:
    name: Go CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test ./...
