[workspace]
resolver = "3"
members = ["crates/fabric-recovery", "crates/fabric-snapshot", "crates/fabric-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 stabilized std::fs::File::lock, which the store uses for its process lock.
rust-version = "1.89"
publish = false

[workspace.dependencies]
blake3 = "1.8"
ignore = "0.4"
serde = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
