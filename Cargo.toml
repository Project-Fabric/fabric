[workspace]
resolver = "3"
members = [
    "crates/cosigna-agent",
    "crates/fabric-cli",
    "crates/fabric-recovery",
    "crates/fabric-snapshot",
    "crates/fabric-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 stabilized std::fs::File::lock, which the store uses for its process lock.
rust-version = "1.89"
publish = false

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ed25519-dalek = "2"
globset = "0.4"
getrandom = "0.3"
ignore = "0.4"
regex = "1"
serde = "1"
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
toml_edit = "0.22"
ureq = { version = "3", features = ["json"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
