[package]
name = "cosigna-agent"
description = "Cosigna's local development task and transaction service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
clap.workspace = true
dirs.workspace = true
getrandom.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync"] }
base64 = "0.22"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
url = "2"
hmac = "0.12"
sha2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha3 = "0.10"

[dev-dependencies]
tiny_http = "0.12"
rsa = "0.9"
rand = "0.8"

[lints]
workspace = true
