[package]
name = "fabric-cli"
description = "The fabric command: checkpoints, diffs and verified restore for AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fabric"
path = "src/main.rs"

# The product's name; the same program as `fabric`, which stays for existing scripts.
[[bin]]
name = "cosigna"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
fabric-recovery = { path = "../fabric-recovery" }
fabric-snapshot = { path = "../fabric-snapshot" }
fabric-store = { path = "../fabric-store" }
getrandom.workspace = true
globset.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
similar.workspace = true
toml_edit.workspace = true
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
