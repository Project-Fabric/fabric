[package]
name = "fabric-cli"
description = "The fabric command: checkpoints, diffs and verified restore for AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fabric"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dirs.workspace = true
fabric-recovery = { path = "../fabric-recovery" }
fabric-snapshot = { path = "../fabric-snapshot" }
fabric-store = { path = "../fabric-store" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
