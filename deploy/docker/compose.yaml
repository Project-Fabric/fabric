# Cosigna, self-hosted: the gateway API, the console, the worker (scheduled tasks, lookup-only
# refund recovery, alerts) and a TLS proxy. Only the proxy is published. Synthetic fixture rail by default;
# add compose.stripe-test.yaml for Stripe test mode. See deploy/docker/README.md.
name: cosigna

x-gateway: &gateway
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: cosigna-gateway:local
  volumes:
    - cosigna-data:/data
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  gateway:
    <<: *gateway
    command: ["serve", "--listen", "0.0.0.0:3092", "--public-host", "${COSIGNA_PUBLIC_HOST:-localhost}",
              "--trust-local-clients"]

  worker:
    <<: *gateway
    command: ["worker"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      disable: true

  # The console runs in the gateway's network namespace and reaches it at 127.0.0.1:3092, which
  # the gateway trusts only from its own loopback (--trust-local-clients). It reads the owner
  # credential from the gateway's volume, read-only, and never sends it to the browser.
  console:
    build:
      context: ../..
      dockerfile: deploy/docker/console.Dockerfile
    image: cosigna-console:local
    network_mode: "service:gateway"
    environment:
      CONSOLE_PORT: "3090"
      CONSOLE_USER: ${COSIGNA_CONSOLE_USER:-owner}
      # What people type in the browser, including the port if it is not 443.
      CONSOLE_PUBLIC_ORIGIN: ${COSIGNA_CONSOLE_ORIGIN:-https://localhost}
      CONSOLE_GATEWAY_URL: http://127.0.0.1:3092
      CONSOLE_GATEWAY_DIR: /gateway
    volumes:
      - cosigna-data:/gateway:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.8.4-alpine
    environment:
      COSIGNA_PUBLIC_HOST: ${COSIGNA_PUBLIC_HOST:-localhost}
    ports:
      - "${COSIGNA_HTTPS_PORT:-443}:443"
      - "${COSIGNA_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cosigna-data:
  caddy-data:
  caddy-config:
