<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approve on phone · Cosigna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cosigna.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; }
  .phone { width: 100%; max-width: 390px; min-height: 780px; border: 1px solid var(--line); border-radius: 44px; padding: 20px 20px 28px;
    display: flex; flex-direction: column; gap: 22px; background: var(--ground); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px 0; }
  .amount { font-family: var(--font-mono); font-size: 52px; letter-spacing: -0.03em; line-height: 1; }
  .amount small { font-size: 18px; color: var(--muted); }
  .who { display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; }
  .facts { display: flex; flex-direction: column; padding: 4px 18px; }
  .facts div { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .facts div:first-child { border-top: 0; }
  .facts span:first-child { color: var(--muted); }
  .facts span:last-child { text-align: right; }
  .warn { display: flex; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--waiting-soft); color: var(--waiting-text); font-size: 14px; line-height: 1.45; }
  .warn svg { flex-shrink: 0; margin-top: 2px; }
  .cta { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .cta .btn { min-height: 56px; font-size: 17px; width: 100%; }
  .hint { text-align: center; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <a class="mark" href="#" aria-label="Cosigna">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><circle cx="25" cy="32" r="17" fill="none" stroke="#8E7DFF" stroke-width="6"/><circle cx="39" cy="32" r="17" fill="none" stroke="#F2F3F5" stroke-width="6"/></svg>
    </a>
    <span class="chip chip-waiting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Waiting for you</span>
  </div>

  <div class="who">
    <span class="eyebrow">claude-code wants to refund</span>
    <div class="amount">$450.00 <small>USD</small></div>
    <h1 class="display">Order #2045, cancelled before shipping</h1>
  </div>

  <div class="facts card">
    <div><span>Customer payment</span><span class="mono" style="font-size:13px">pi_3…2045</span></div>
    <div><span>Spent today</span><span><span class="mono">$182.98</span> of <span class="mono">$500</span></span></div>
    <div><span>Requested</span><span>2 min ago</span></div>
  </div>

  <div class="warn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    This refund would take today's spending over the $500 limit.
  </div>

  <div class="cta">
    <button class="btn btn-primary">Approve with Face ID</button>
    <button class="btn btn-danger">Reject</button>
    <span class="hint">Approves this exact refund, once. Signed with your key.</span>
  </div>
</div>
</body>
</html>
